[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version = "6.1.3" }
assertj-core = { module = "org.assertj:assertj-core", version = "3.27.7" }
fastdoubleparser = { module = "ch.randelshofer:fastdoubleparser", version = "2.0.1" }
gummy-bears = { module = "com.toasttab.android:gummy-bears-api-34", version = "0.16.0" }
spotbugs = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version = "6.5.13" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version = "3.2.4" }
# Error Prone 2.42.0 pulls Guava 33.4.0, which calls sun.misc.Unsafe (warning on JDK 24+)
guava = { module = "com.google.guava:guava", version = "33.7.2-jre" }
# Do not update – Error Prone 2.43.0+ requires Java 21, but OSS-Fuzz uses Java 17
errorprone = { module = "com.google.errorprone:error_prone_core", version = "2.42.0" }
nullaway = { module = "com.uber.nullaway:nullaway", version = "0.14.3" }

[plugins]
jmh = { id = "me.champeau.jmh", version = "0.7.4" }
pitest = { id = "info.solidsoft.pitest", version = "1.19.0" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version = "2.0.1" }
bnd = { id = "biz.aQute.bnd.builder", version = "7.4.0" }
jreleaser = { id = "org.jreleaser", version = "1.27.0" }
errorprone = { id = "net.ltgt.errorprone", version = "5.2.0" }
