name: Java 17 Compatibility Check (for OSS-Fuzz)

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'website/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'website/**'

jobs:
  build:

    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v7
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v6
    - name: Build with Gradle
      run: ./gradlew lib:jar
