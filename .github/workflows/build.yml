name: build

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'website/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'website/**'

permissions:
  contents: read
  checks: write # test report

jobs:
  build:

    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - name: Build with Gradle
      run: ./gradlew build
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
      if: ${{ !cancelled() }}
      with:
        report_paths: 'lib/build/test-results/*/TEST-*.xml'
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./lib/build/reports/jacoco/test/jacocoTestReport.xml
